<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>왜 떨어졌나 · 순서대로 보기</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&display=block" rel="stylesheet">
<style>
html,body{margin:0;background:#efe8d6;font-family:'Gowun Batang',serif;color:#2a2622}
.wrap{position:relative;max-width:720px;margin:0 auto}
canvas{display:block;width:100%;height:auto}
.opts{position:absolute;left:0;right:0;top:44%;display:none;justify-content:center;gap:14px}
.opts button{font:700 17px 'Gowun Batang';background:#fbf7ea;border:1.5px solid #2a2622;box-shadow:2px 2px 0 #2a2622;padding:6px 18px;cursor:pointer;color:#2a2622}
.opts button.right{background:#24427a;color:#fbf7ea;border-color:#24427a}
.opts button.wrong{opacity:.35}
.ctrl{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 0 10px;border-top:1.5px solid #2a2622;background:#fbf7ea}
.ctrl button{font:700 14px 'Gowun Batang';background:none;border:1.5px solid #2a2622;padding:4px 12px;cursor:pointer;color:#2a2622}
.ctrl button:disabled{opacity:.3;cursor:default}
.ctrl button.go{background:#24427a;color:#fbf7ea;border-color:#24427a}
.dots{display:flex;gap:6px}.dot{width:22px;height:4px;background:#cfc7b3}.dot.on{background:#24427a}
body.auto .ctrl{display:none}
</style></head><body>
<div class="wrap" id="wrap">
  <canvas id="c" width="720" height="450"></canvas>
  <div class="opts" id="opts"></div>
  <div class="ctrl"><button id="prev">◀ 이전</button><div class="dots" id="dots"></div><button id="replay">다시 보기</button><button id="next" class="go">다음 ▶</button></div>
</div>
<script>
// ---------- 플레이어: 데이터 파일만 바꿔 끼운다 (?d=파일이름, ?auto=1 자동 재생)
const Q=new URLSearchParams(location.search);
const AUTO=Q.get('auto')==='1';if(AUTO)document.body.classList.add('auto');
const ds=document.createElement('script');ds.src='data/'+(Q.get('d')||'nvda-deepseek').replace(/[^\w-]/g,'')+'.js';
ds.onload=()=>document.fonts.ready.then(start);document.head.appendChild(ds);

const W=720,H=450,INK='#2a2622',PAPER='#fbf7ea',RED='#b23a2a',BLUE='#24427a',GOLD='#f3d77a',GREY='#9a917f';
const cv=document.getElementById('c'),g=cv.getContext('2d');
const DPR=Math.min(2,devicePixelRatio||1);cv.width=W*DPR;cv.height=H*DPR;g.scale(DPR,DPR);
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t),seg=(t,a,b)=>ease((t-a)/(b-a)),lerp=(a,b,u)=>a+(b-a)*u;
// 손그림 선: 두 번 살짝 어긋나게
function hline(x1,y1,x2,y2,c=INK,w=1.6){g.strokeStyle=c;g.lineWidth=w;g.lineCap='round';
  for(let k=0;k<2;k++){const j=k?.7:-.4;g.beginPath();g.moveTo(x1+j,y1-j);g.lineTo(x2-j,y2+j);g.stroke();}}
function hrect(x,y,w,h,fill,c=INK,lw=1.5){if(fill){g.fillStyle=fill;g.fillRect(x,y,w,h);}hline(x,y,x+w,y,c,lw);hline(x+w,y,x+w,y+h,c,lw);hline(x+w,y+h,x,y+h,c,lw);hline(x,y+h,x,y,c,lw);}
function txt(s,x,y,size,{font='Gowun Batang',bold=false,color=INK,align='center',alpha=1}={}){g.globalAlpha=alpha;g.fillStyle=color;g.font=(bold?'700 ':'')+size+"px '"+font+"'";g.textAlign=align;g.textBaseline='middle';g.fillText(s,x,y);g.globalAlpha=1;}
const pen=(s,x,y,size,color=INK,alpha=1)=>txt(s,x,y,size,{font:'Nanum Pen Script',color,alpha});

let D,cur=0,t0=0,picked=-1,pickT=0,X=[],idxOf={};
// 차트 좌표
const CX0=90,CX1=640,CY0=388,CY1=262;let pmin,pmax;
const px=i=>lerp(CX0,CX1,i/(D.series.length-1));
const py=v=>lerp(CY0,CY1,(v-pmin)/(pmax-pmin));
function parse(s){const m=s.match(/^(.*)\{(.+)\}(.*)$/);return m?{pre:m[1],word:m[2],post:m[3]}:{pre:s,word:'',post:''};}

function background(){g.fillStyle='#efe8d6';g.fillRect(0,0,W,H);g.strokeStyle='#e2dccb';g.lineWidth=1;
  for(let x=0;x<=W;x+=24){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();}for(let y=0;y<=H;y+=24){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}}
function chart(until,reveal=1){ // until = 마지막 인덱스, reveal = 그 구간 그리는 비율
  hline(CX0-20,CY0+12,CX1+30,CY0+12,GREY,1.2);
  const n=until;const total=n*reveal;
  g.strokeStyle=BLUE;g.lineWidth=3;g.lineJoin='round';g.beginPath();g.moveTo(px(0),py(D.series[0][1]));
  for(let i=1;i<=Math.ceil(total);i++){const f=Math.min(1,total-(i-1));const xa=px(i-1),ya=py(D.series[i-1][1]),xb=px(i),yb=py(D.series[i][1]);g.lineTo(lerp(xa,xb,f),lerp(ya,yb,f));}
  g.stroke();
  const lab=(i)=>{const [d,v]=D.series[i];pen(d.slice(5).replace('-','/').replace(/^0/,''),px(i),CY0+28,20,GREY);};
  lab(0);if(total>=n-.01)lab(n);
  if(total>=n-.01){const v=D.series[n][1];g.fillStyle=BLUE;g.beginPath();g.arc(px(n),py(v),4,0,7);g.fill();pen(v.toFixed(0)+' '+D.unit,px(n)+(n===D.series.length-1?0:-6),py(v)+(n===D.series.length-1?22:-18),20,BLUE);}
}
function chip(x,y,w=34,h=12,alpha=1,dashed=false){g.globalAlpha=alpha;if(dashed){g.setLineDash([4,3]);g.strokeStyle=GREY;g.lineWidth=1.4;g.strokeRect(x-w/2,y-h/2,w,h);g.setLineDash([]);}
  else{hrect(x-w/2,y-h/2,w,h,'#d9d2bf');for(let k=-w/2+5;k<w/2;k+=7){hline(x+k,y-h/2-3,x+k,y-h/2,INK,1);hline(x+k,y+h/2,x+k,y+h/2+3,INK,1);}}g.globalAlpha=1;}
function balloon(x,y,r,word,{pop=0,ghost=false}={}){const ay=y+r+38;
  if(ghost){g.setLineDash([5,4]);g.strokeStyle=GREY;g.lineWidth=1.5;g.beginPath();g.ellipse(x,y,r*.9,r,0,0,7);g.stroke();g.setLineDash([]);pen(word,x,y,22,GREY);return;}
  if(pop>0){for(let k=0;k<8;k++){const a=k*Math.PI/4,r1=r*(.6+pop*.6),r2=r*(1+pop);hline(x+Math.cos(a)*r1,y+Math.sin(a)*r1,x+Math.cos(a)*r2,y+Math.sin(a)*r2,RED,2);}return;}
  hline(x,y+r,x+4,ay,INK,1.2);g.fillStyle='#f6e39c';g.beginPath();g.ellipse(x,y,r*.9,r,0,0,7);g.fill();g.strokeStyle=INK;g.lineWidth=1.6;g.stroke();
  if(r>14)pen(word,x,y,Math.min(30,r*.9),INK);}

// ---------- 원인 유형 템플릿 (현상 애니메이션). 새 유형 = 함수 하나 추가
const T={
 competitor:{target:()=>[450,215],draw(u,s){const p=s.p;
   for(let i=0;i<p.oldChips;i++)chip(270,226-i*14,34,12,seg(u,i*.05,i*.05+.2));pen(p.old,270,248,22,INK,seg(u,0,.3));
   for(let i=0;i<p.newChips;i++)chip(450,226-i*14,34,12,seg(u,.5+i*.15,.7+i*.15));
   const a=seg(u,1.2,1.6);if(a>0){[[270,226-p.oldChips*14-22],[450,226-p.newChips*14-22]].forEach(([x,y])=>{g.globalAlpha=a;hrect(x-22,y-14,44,28,PAPER);g.globalAlpha=1;pen('AI',x,y+1,24,BLUE,a);});
     pen('비슷한 성능',360,108,24,RED,seg(u,1.7,2.0));}}},
 question:{target:()=>[360,170],draw(u,s,pu){const p=s.p;const bx=560,by=150;
   hrect(bx-40,by-46,80,60,PAPER);hline(bx-48,by-46,bx,by-74);hline(bx,by-74,bx+48,by-46);pen(p.to,bx,by-16,22);
   hline(130,by+16,bx-44,by+16,GREY,1.2);
   for(let i=0;i<p.boxes;i++){let x=140+((i*48+u*40)%380);const lost=pu>0&&i%2===1;const a=lost?1-seg(pu,0,.8)*.75:1;
     chip(x,by+4,28,18,a,lost&&pu>.3);if(lost&&pu>.4)pen('?',x,by-18,24,RED,seg(pu,.4,.7));}
   if(pu>.9)pen('주문이 줄까 걱정',360,108,24,RED,seg(pu,.9,1.3));}},
 expectation:{target:(s)=>{const i=idxOf[s.p.at];return [px(i),py(D.series[i][1])-80];},draw(u,s){const i=idxOf[s.p.at];
   const x=px(i),y=py(D.series[i][1])-80;balloon(x,y,26*seg(u,0,.9)+.01,parse(s.text).word);}},
 selling:{target:(s)=>{const i=idxOf[s.p.from];return [px(i)-90,150];},draw(u,s){const p=s.p,i=idxOf[p.from],j=idxOf[p.to];
   const x=px(i),y=py(D.series[i][1])-80;
   if(u<1.3)balloon(x+Math.sin(u*20)*seg(u,.6,1.2)*3,y,26,'기대');else if(u<1.7)balloon(x,y,26,'',{pop:seg(u,1.3,1.7)});
   for(let k=0;k<6;k++){const st=k*.16,yy=lerp(60,y-50+ (k%3)*0,seg(u,st,st+.5));const xx=x-110+(k%3)*30+(k>2?15:0),yb=k>2?yy-22:yy;
     if(u>st){g.globalAlpha=Math.min(1,(u-st)*4)*(u>2.4?.35:1);hrect(xx-14,yb-10,28,20,'#e9b3a8');g.globalAlpha=1;}}
   const r=seg(u,1.5,2.3);if(r>0){g.strokeStyle=RED;g.lineWidth=3.4;g.beginPath();const ya=py(D.series[i][1]),yb=py(D.series[j][1]);g.moveTo(x,ya);g.lineTo(lerp(x,px(j),r),lerp(ya,yb,r));g.stroke();}
   if(u>2.3){const yb=py(D.series[j][1]);g.fillStyle=RED;g.beginPath();g.arc(px(j),yb,4,0,7);g.fill();txt(p.mark,px(j)-78,yb+6,30,{bold:true,color:RED,alpha:seg(u,2.3,2.6)});pen(D.series[j][1].toFixed(0)+' '+D.unit,px(j),yb+20,20,RED,seg(u,2.3,2.6));}
   if(u>2.7)pen(p.note,360,210,24,INK,seg(u,2.7,3.1));}},
 end:{target:()=>{const i=D.series.length-2;return [px(i),py(D.series[i][1])-80];},draw(u,s){const j=D.series.length-1,i=j-1;
   balloon(px(i),py(D.series[i][1])-80,26,'기대',{ghost:true});
   g.strokeStyle=RED;g.lineWidth=3.4;g.beginPath();g.moveTo(px(i),py(D.series[i][1]));g.lineTo(px(j),py(D.series[j][1]));g.stroke();txt(s.p.mark,px(j)-78,py(D.series[j][1])+6,30,{bold:true,color:RED});}},
};
const chartIdx=s=>idxOf[s.chart];

// ---------- 단계 진행
const FLY0=.9,FLY1=1.8;
function frame(now){const t=(now-t0)/1000,s=D.steps[cur],ty=T[s.type];background();
  // 차트
  const ci=s.type==='selling'?idxOf[s.p.from]:chartIdx(s);
  chart(ci,s.draw?seg(t,0,1.6):1);
  // 문장 (한 단계 한 문장)
  const P=parse(s.text);g.font="700 25px 'Gowun Batang'";const wPre=g.measureText(P.pre).width,wW=g.measureText(P.word).width,wAll=g.measureText(P.pre+P.word+P.post).width;
  const sx=W/2-wAll/2,sy=48,a=seg(t,0,.5);const wx=sx+wPre+wW/2;
  const hl=seg(t,.5,.9);if(hl>0){g.fillStyle=GOLD;g.fillRect(sx+wPre-2,sy+2,(wW+4)*hl,12);}
  txt(P.pre,sx,sy,25,{bold:true,align:'left',alpha:a});txt(P.word,sx+wPre,sy,25,{bold:true,align:'left',alpha:a,color:BLUE});txt(P.post,sx+wPre+wW,sy,25,{bold:true,align:'left',alpha:a});
  // 단어가 가운데(현상 자리)로 날아간다
  const f=seg(t,FLY0,FLY1);const [tx,tyy]=ty.target(s);
  if(f>0&&f<1){const x=lerp(wx,tx,f),y=lerp(sy,tyy,f)-Math.sin(f*Math.PI)*40;txt(P.word,x,y,25+f*8,{bold:true,color:BLUE});}
  // 현상
  const u=t-FLY1;if(u>0){const pu=picked>=0?(now-pickT)/1000:-1;ty.draw(u,s,pu);}
  if(s.options&&u>0&&opts.style.display!=='flex')showOpts(s);
  txt('자료: '+D.source,14,H-14,11,{align:'left',color:GREY});
  if(AUTO)autoStep(t,s);
  requestAnimationFrame(frame);}
const opts=document.getElementById('opts');
function showOpts(s){opts.innerHTML='';s.options.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>choose(i);opts.appendChild(b);});opts.style.display='flex';}
function choose(i){if(picked>=0)return;picked=i;pickT=performance.now();const s=D.steps[cur];[...opts.children].forEach((b,j)=>b.classList.add(j===s.right?'right':'wrong'));}
function go(n){cur=n;t0=performance.now();picked=-1;opts.style.display='none';opts.innerHTML='';
  [...dots.children].forEach((d,i)=>d.classList.toggle('on',i<=cur));prev.disabled=cur===0;next.disabled=cur===D.steps.length-1;window.__step=cur;}
const DUR={competitor:4.2,question:5.2,expectation:4.4,selling:5.6,end:4.5};
function autoStep(t,s){if(s.options&&picked<0&&t>FLY1+1.0)choose(s.right);
  if(cur<D.steps.length-1&&t>DUR[s.type])go(cur+1);else if(cur===D.steps.length-1&&t>DUR[s.type])window.__done=1;}
const prev=document.getElementById('prev'),next=document.getElementById('next'),dots=document.getElementById('dots');
prev.onclick=()=>cur>0&&go(cur-1);next.onclick=()=>cur<D.steps.length-1&&go(cur+1);
document.getElementById('replay').onclick=()=>go(cur);
function start(){D=window.SIM_DATA;D.series.forEach(([d],i)=>idxOf[d]=i);const v=D.series.map(x=>x[1]);pmin=Math.min(...v)-4;pmax=Math.max(...v)+4;
  D.steps.forEach(()=>{const d=document.createElement('div');d.className='dot';dots.appendChild(d);});go(0);requestAnimationFrame(frame);document.body.dataset.ready='1';}
</script></body></html>
